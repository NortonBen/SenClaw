<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="0.55" stop-color="#6E7CF0"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="claw" x1="300" y1="220" x2="724" y2="804" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF1FF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0B0E14" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>
  <!-- subtle top sheen -->
  <rect x="0" y="0" width="1024" height="512" rx="232" ry="232" fill="#FFFFFF" opacity="0.06"/>

  <!-- three tapered claw slashes — identical blades, evenly spaced, centered on x=512 -->
  <g fill="url(#claw)" filter="url(#sh)">
    <path d="M341 232 C 293 430 305 612 403 792 C 359 612 363 430 403 250 Z"/>
    <path d="M481 232 C 433 430 445 612 543 792 C 499 612 503 430 543 250 Z"/>
    <path d="M621 232 C 573 430 585 612 683 792 C 639 612 643 430 683 250 Z"/>
  </g>
</svg>
