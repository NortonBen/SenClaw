[package]
name = "zeach"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zeach"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs", "cors"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.24"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
url = "2"
# Corpus ingestion. Same crates apps/ontology uses for the same job
# (apps/ontology/src/ingest.rs), so the extraction behaviour matches.
pdf-extract = "0.7"      # PDF text layer (scans have none — reported, not swallowed)
quick-xml = "0.37"       # docx innards
zip = { version = "2", default-features = false, features = ["deflate"] } # docx container

[dev-dependencies]
tempfile = "3"
