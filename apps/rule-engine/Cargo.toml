[package]
name = "rule-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rule-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs", "cors"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
async-stream = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
# Cron specs for the `schedule` source node. Already in the workspace lockfile.
cron = "0.13"
chrono-tz = "0.10"

[dev-dependencies]
tempfile = "3"
