[package]
name = "discuss"
version = "0.1.0"
edition = "2021"
description = "AI Discuss Team — phòng thảo luận AI đa thành viên cho SenClaw (BOSS + Manager + Thư ký + member AI có bộ nhớ riêng)"
license = "MIT"

[[bin]]
name = "discuss"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs", "cors"] }
# Pin rusqlite to the workspace-wide 0.32 — a version skew across crates that
# both bundle SQLite is a link error (lesson from apps/hub).
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
async-stream = "0.3"
chrono = "0.4"
pdf-extract = "0.7"

[dev-dependencies]
tempfile = "3"
