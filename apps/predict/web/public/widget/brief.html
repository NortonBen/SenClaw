<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Siêu Dự Đoán hôm nay</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; padding: 10px 12px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .k { opacity: .65; }
  .v { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  h4 { margin: 0 0 6px; font-size: 13px; }
  .muted { opacity: .5; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<h4>🔮 Siêu Dự Đoán hôm nay</h4>
<div id="c">Đang tải…</div>
<script>
  fetch('../api/overview').then(r => r.json()).then(o => {
    const g = o.gold || {};
    const w = (o.weather && o.weather.days && o.weather.days[0]) || null;
    const m = (o.football_today && o.football_today[0]) || null;
    const lot = o.lottery_latest;
    const rows = [];
    if (g.xau_usd) rows.push(['Vàng (USD/oz)', g.xau_usd.price + (g.momentum_24h_pct != null ? ` (${g.momentum_24h_pct >= 0 ? '+' : ''}${g.momentum_24h_pct}%)` : '')]);
    if (g.xau_vnd_luong_trieu) rows.push(['Quy đổi (tr/lượng)', g.xau_vnd_luong_trieu.price]);
    if (w) rows.push([`${o.weather_city} hôm nay`, `${w.t_min}–${w.t_max}°C · mưa ${w.rain_prob}%`]);
    if (lot) rows.push([`ĐB kỳ ${lot.date}`, lot.special]);
    if (m) rows.push([`${m.home} vs ${m.away}`, `${Math.round(m.p_home * 100)}/${Math.round(m.p_draw * 100)}/${Math.round(m.p_away * 100)}%`]);
    document.getElementById('c').innerHTML =
      rows.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('') +
      '<div class="muted">Thống kê & tham khảo — không phải lời khuyên đầu tư/cá cược.</div>';
  }).catch(() => { document.getElementById('c').textContent = 'Không kết nối được app.'; });
</script>
</body>
</html>
