[package]
name = "ba"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ba"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs", "cors"] }
# 0.32 exactly — a version skew here is a link error, not a warning
# (bài học apps/hub).
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
regex = "1"
pulldown-cmark = "0.12"

[dev-dependencies]
tempfile = "3"
