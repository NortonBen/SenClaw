[package]
name = "json-tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "json-tool"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
# NOTE: no `preserve_order`. CI runs `cargo test --all`, and Cargo unifies
# features across the workspace — enabling it here would silently swap
# serde_json's Map for an IndexMap inside the senclaw crate too. Key order
# where it matters is handled by src/fmt.rs, which re-indents the raw text.
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs", "cors"] }
futures-util = "0.3"
async-stream = "0.3"
csv = "1"
quick-xml = "0.36"
base64 = "0.22"
percent-encoding = "2"
rmp-serde = "1"
