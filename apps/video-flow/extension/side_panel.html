<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Video Flow — SenClaw</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #080812;
      --surface:    #0f0f20;
      --card:       #151528;
      --card2:      #1c1c38;
      --border:     #1e1e40;
      --border2:    #2a2a50;
      --accent:     #6366f1;
      --accent-dim: #3730a3;
      --accent-glow:rgba(99,102,241,0.18);
      --green:      #22c55e;
      --green-dim:  rgba(34,197,94,0.12);
      --red:        #f05050;
      --red-dim:    rgba(240,80,80,0.12);
      --yellow:     #f59e0b;
      --yellow-dim: rgba(245,158,11,0.12);
      --text:       #dde4f0;
      --text2:      #8892aa;
      --muted:      #4a5270;
      --mono:       'DM Mono','Fira Code','Cascadia Code',monospace;
    }

    html, body { height: 100%; margin: 0; }

    body {
      width: 100%;
      min-width: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .logo-icon {
      width: 22px; height: 22px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--accent);
    }

    .logo-text {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.03em; color: var(--text);
    }

    .logo-text em { color: var(--accent); font-style: normal; }
    .logo-sub {
      display: block;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 1px;
    }

    #conn-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--red);
      transition: background .3s, box-shadow .3s;
      flex-shrink: 0;
    }

    #conn-dot.on {
      background: var(--green);
      box-shadow: 0 0 8px 2px rgba(34,197,94,.4);
      animation: pulse-dot 2.4s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%,100% { box-shadow: 0 0 4px 1px rgba(34,197,94,.35); }
      50%      { box-shadow: 0 0 12px 3px rgba(34,197,94,.15); }
    }

    .toggle-wrap { display: flex; align-items: center; gap: 5px; }
    .toggle-label { font-size: 9px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

    .toggle { position: relative; width: 30px; height: 17px; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track { position: absolute; inset: 0; background: var(--border2); border-radius: 9px; transition: background .25s; }
    .toggle-thumb { position: absolute; top: 3px; left: 3px; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); transition: transform .25s, background .25s; }
    .toggle input:checked ~ .toggle-track { background: var(--accent-dim); }
    .toggle input:checked ~ .toggle-thumb { transform: translateX(13px); background: var(--accent); }

    /* ── Metrics ─────────────────────────────────── */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }

    .metric-card {
      background: var(--card);
      padding: 9px 6px 7px;
      text-align: center;
    }

    .metric-val {
      font-size: 20px; font-weight: 700;
      line-height: 1; letter-spacing: -.03em;
      color: var(--text); margin-bottom: 3px;
    }

    .metric-val.g { color: var(--green); }
    .metric-val.r { color: var(--red); }

    .metric-lbl {
      font-size: 8px; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted);
    }

    /* ── Status bar ──────────────────────────────── */
    .status-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 10px; color: var(--muted);
    }

    #state-badge {
      padding: 1px 7px; border-radius: 3px;
      font-size: 8px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em;
      background: var(--border2); color: var(--muted);
    }

    #state-badge.idle    { background: var(--green-dim);  color: var(--green); }
    #state-badge.running { background: var(--yellow-dim); color: var(--yellow); }

    #token-status {
      margin-left: auto; font-size: 10px;
    }
    #token-status.ok   { color: var(--green); }
    #token-status.bad  { color: var(--red); }
    #token-status.warn { color: var(--yellow); }

    /* ── Log section ─────────────────────────────── */
    .log-section {
      flex: 1; display: flex; flex-direction: column; min-height: 0;
    }

    .log-header {
      display: flex; align-items: center;
      padding: 7px 12px 6px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 6px;
    }

    .log-title {
      font-size: 9px; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted);
      flex: 1;
    }

    #log-count {
      background: var(--border2);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 9px; color: var(--text2);
    }

    .btn-icon {
      display: flex; align-items: center; justify-content: center;
      width: 22px; height: 22px;
      background: none;
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px; line-height: 1;
      transition: border-color .15s, color .15s, background .15s;
      flex-shrink: 0;
    }

    .btn-icon:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }
    .btn-icon:active { opacity: .7; }

    .log-scroll {
      flex: 1; overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border2) transparent;
    }

    .log-scroll::-webkit-scrollbar { width: 3px; }
    .log-scroll::-webkit-scrollbar-track { background: transparent; }
    .log-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      position: sticky; top: 0; z-index: 1;
      padding: 5px 8px;
      font-size: 8px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    /* Column widths */
    thead th.col-id     { width: 56px; }
    thead th.col-type   { width: auto; }
    thead th.col-time   { width: 54px; }
    thead th.col-status { width: 72px; }
    thead th.col-out    { width: 46px; text-align: center; white-space: nowrap; }
    thead th.col-del    { width: 28px; }

    tbody tr {
      border-bottom: 1px solid rgba(30,30,64,.7);
      transition: background .1s;
    }

    tbody tr:hover { background: rgba(79,142,247,.04); }

    tbody td {
      padding: 5px 8px;
      vertical-align: middle;
      white-space: nowrap;
    }

    .td-id {
      font-size: 9px; color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: transparent;
      transition: text-decoration-color .15s;
      font-variant-numeric: tabular-nums;
    }
    .td-id:hover { text-decoration-color: var(--accent); }

    .td-type {
      font-size: 10px; font-weight: 700;
      color: var(--accent); letter-spacing: .04em;
    }

    .td-time {
      font-size: 9px; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 1px 5px; border-radius: 3px;
      font-size: 8px; font-weight: 700; letter-spacing: .04em;
    }
    .badge-ok   { background: var(--green-dim);  color: var(--green); }
    .badge-fail { background: var(--red-dim);    color: var(--red); }
    .badge-proc { background: var(--yellow-dim); color: var(--yellow); }

    /* Output cell */
    .td-out { text-align: center; }

    .thumb {
      width: 30px; height: 30px;
      object-fit: cover;
      border-radius: 3px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      transition: opacity .15s, transform .15s;
    }
    .thumb:hover { opacity: .85; transform: scale(1.05); }

    .play-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 4px;
      cursor: pointer;
      color: var(--accent);
      font-size: 13px;
      transition: background .15s;
    }
    .play-btn:hover { background: var(--accent); color: #fff; }

    .td-del { text-align: center; }

    .del-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px;
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: 14px; line-height: 1;
      border-radius: 3px;
      transition: color .15s, background .15s;
    }
    .del-btn:hover { color: var(--red); background: var(--red-dim); }

    .log-empty {
      padding: 28px 14px;
      text-align: center; color: var(--muted);
      font-size: 11px; letter-spacing: .04em;
    }

    /* ── Bottom bar ──────────────────────────────── */
    .bottom-bar {
      display: flex; gap: 6px;
      padding: 9px 12px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .btn {
      flex: 1;
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: 10px; font-weight: 600;
      letter-spacing: .05em; text-transform: uppercase;
      border: 1px solid var(--border2);
      border-radius: 5px;
      background: var(--card);
      color: var(--text2);
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }

    .btn:hover { background: var(--card2); border-color: var(--border2); color: var(--text); }
    .btn:active { opacity: .7; }

    .btn-primary {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: #c8dcff;
    }

    .btn-primary:hover {
      background: rgba(79,142,247,.3);
      color: #fff;
    }

    /* ── Modals ──────────────────────────────────── */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 200;
    }

    .overlay.open { display: flex; align-items: center; justify-content: center; }

    .modal {
      width: 92%;
      max-height: 85vh;
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 8px;
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    .modal-hd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 700; color: var(--accent);
    }

    .modal-close {
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: 18px; line-height: 1;
      padding: 0 2px;
    }
    .modal-close:hover { color: var(--text); }

    /* Detail modal */
    .detail-body {
      padding: 10px 14px;
      overflow-y: auto;
      font-size: 10px; line-height: 1.6;
    }

    .detail-row {
      display: flex; gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(30,30,64,.5);
    }

    .detail-lbl {
      width: 84px; flex-shrink: 0;
      color: var(--muted); font-weight: 700;
      text-transform: uppercase; font-size: 8px; letter-spacing: .06em;
    }

    .detail-val {
      flex: 1; word-break: break-all; color: var(--text);
    }
    .detail-val.err  { color: var(--red); }
    .detail-val.good { color: var(--green); }

    .detail-actions { margin: 4px 0 10px; }
    .open-project-btn {
      width: 100%; padding: 9px 12px; border-radius: 8px; cursor: pointer;
      font-size: 12px; font-weight: 600;
      background: var(--accent, #6c8cff); color: #fff; border: 1px solid transparent;
    }
    .open-project-btn:hover { filter: brightness(1.08); }

    .detail-block { margin-top: 10px; }
    .detail-block-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
    }
    .copy-btn {
      font-size: 10px; padding: 2px 8px; border-radius: 6px; cursor: pointer;
      background: var(--surface-raised, #1b2230); color: var(--text);
      border: 1px solid var(--border, #2a3342);
    }
    .copy-btn:hover { border-color: var(--accent, #6c8cff); }
    .detail-pre {
      margin: 0; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all;
      font-family: var(--mono, ui-monospace, monospace); font-size: 11px; line-height: 1.45;
      padding: 8px 10px; border-radius: 8px;
      background: var(--surface-raised, #0f1420); border: 1px solid var(--border, #2a3342);
      color: var(--text);
    }

    .detail-media {
      margin: 10px 0 4px;
      text-align: center;
    }

    .detail-media img {
      max-width: 100%; max-height: 200px;
      border-radius: 5px; cursor: pointer;
    }

    .detail-media video {
      max-width: 100%; max-height: 200px;
      border-radius: 5px;
    }

    /* Preview modal */
    .preview-body {
      display: flex; align-items: center; justify-content: center;
      padding: 10px;
      background: var(--bg);
      min-height: 120px;
    }

    .preview-body img {
      max-width: 100%; max-height: 75vh;
      border-radius: 5px;
    }

    .preview-body video {
      max-width: 100%; max-height: 75vh;
      border-radius: 5px;
    }

    /* The bottom bar is the last element now — carry the safe-area padding. */
    .bottom-bar { padding-bottom: calc(9px + env(safe-area-inset-bottom, 0px)); }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">▶</div>
      <div class="logo-text">Video <em>Flow</em><span class="logo-sub">SenClaw</span></div>
    </div>
    <div id="conn-dot"></div>
    <div class="toggle-wrap">
      <span class="toggle-label" id="toggle-label">OFF</span>
      <label class="toggle">
        <input type="checkbox" id="main-toggle">
        <span class="toggle-track"></span>
        <span class="toggle-thumb"></span>
      </label>
    </div>
  </header>

  <!-- Metrics -->
  <div class="metrics">
    <div class="metric-card">
      <div class="metric-val" id="m-total">0</div>
      <div class="metric-lbl">Yêu cầu</div>
    </div>
    <div class="metric-card">
      <div class="metric-val g" id="m-success">0</div>
      <div class="metric-lbl">Thành công</div>
    </div>
    <div class="metric-card">
      <div class="metric-val r" id="m-failed">0</div>
      <div class="metric-lbl">Lỗi</div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    TRẠNG THÁI
    <span id="state-badge" class="off">off</span>
    <span id="token-status" class="bad">chưa có token</span>
  </div>

  <!-- Request log -->
  <div class="log-section">
    <div class="log-header">
      <span class="log-title">Nhật ký yêu cầu</span>
      <span id="log-count">0</span>
      <button class="btn-icon" id="btn-clear-log" title="Xoá toàn bộ nhật ký">🗑</button>
    </div>

    <div class="log-scroll">
      <table>
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th class="col-type">Loại</th>
            <th class="col-time">Lúc</th>
            <th class="col-status">Trạng thái</th>
            <th class="col-out">Xem</th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="log-body">
          <tr>
            <td colspan="6" class="log-empty">Chưa có yêu cầu nào</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bottom actions -->
  <div class="bottom-bar">
    <button class="btn btn-primary" id="btn-flow">Mở Google Flow</button>
    <button class="btn" id="btn-token">Lấy lại token</button>
  </div>


  <!-- Detail overlay -->
  <div class="overlay" id="detail-overlay">
    <div class="modal">
      <div class="modal-hd">
        <span id="detail-title">Chi tiết yêu cầu</span>
        <button class="modal-close" id="detail-close">&times;</button>
      </div>
      <div class="detail-body" id="detail-body"></div>
    </div>
  </div>

  <!-- Media preview overlay -->
  <div class="overlay" id="preview-overlay">
    <div class="modal">
      <div class="modal-hd">
        <span id="preview-title">Xem trước</span>
        <button class="modal-close" id="preview-close">&times;</button>
      </div>
      <div class="preview-body" id="preview-body"></div>
    </div>
  </div>

  <script src="side_panel.js"></script>
</body>
</html>
