[package]
name = "lakehouse"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lakehouse"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
serde = { version = "1", features = ["derive"] }
# KHÔNG bật preserve_order — feature unification lan cả workspace (bài học apps/json).
serde_json = "1"
# YAML DSL cho flow (§6.1) — fork serde_yaml còn maintain (serde_yaml gốc archived 2024).
# Chỉ app này thêm dep YAML. Không đụng dep chung nên không lan feature unification.
serde_yaml_ng = "0.10"
anyhow = "1"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs", "cors"] }
futures-util = "0.3"
async-stream = "0.3"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# Parse DSN có cấu trúc để redact mật khẩu (userinfo + query param) — split tay rò
# password chứa '@' / password ở query. Đã có sẵn trong lock (2.5.x), không lan feature.
url = "2"
uuid = { version = "1", features = ["v7"] }
csv = "1"
# calamine kéo chrono không feature — khai chrono std ở trên là đủ (bài học apps/ontology)
calamine = { version = "0.26", features = ["dates"] }

# Query engine — xem docs/data-lake-app-design.md §2.1. Dùng re-export
# datafusion::arrow / datafusion::parquet, KHÔNG dep arrow trực tiếp (lệch major).
# KHÔNG bật feature "compression" của datafusion: nó kéo liblzma (links="lzma"),
# đụng links-conflict với `zip 2` của root senclaw (cũng link lzma). Chỉ mất khả năng
# scan CSV/JSON nén (.gz/.xz) — ngoài scope; codec nén Parquet (zstd/snappy) nằm trong
# crate `parquet`, không liên quan feature này.
datafusion = { version = "54", default-features = false, features = [
    "sql",
    "parquet",
    "datetime_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
    "nested_expressions",
] }
object_store = { version = "0.13.2", features = ["fs"] }

# Connectors §5.2/§11 — Postgres/MySQL qua sqlx 0.9. TUYỆT ĐỐI KHÔNG feature "sqlite"
# (đụng libsqlite3-sys với rusqlite bundled); SQLite dùng rusqlite sẵn có.
# rustls thống nhất repo (tls-rustls-aws-lc-rs). KHÔNG pgpq/tokio-postgres (load = Phase 4).
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "mysql",
    "chrono",
] }

[dev-dependencies]
tempfile = "3"
