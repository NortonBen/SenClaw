[package]
name = "sandbox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sandbox"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs", "cors"] }
# 0.32 exactly — a version skew here is a link error, not a warning
# (bài học apps/hub).
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# Interactive terminal into a sandbox. Same crate/version apps/code-ide uses
# for its integrated terminal, so PTY behaviour matches across apps.
portable-pty = "0.8"

# setsid/killpg: a timed-out run must take its grandchildren with it.
# Unix only — Windows uses a Job Object for the same job.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows direct sandbox: AppContainer (isolation) + Job Object (limits).
# Target-gated so the Unix build is untouched.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
]

[dev-dependencies]
tempfile = "3"
