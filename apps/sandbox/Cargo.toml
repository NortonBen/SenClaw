[package]
name = "sandbox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sandbox"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs", "cors"] }
# 0.32 exactly — a version skew here is a link error, not a warning
# (bài học apps/hub).
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# Interactive terminal into a sandbox. Same crate/version apps/code-ide uses
# for its integrated terminal, so PTY behaviour matches across apps.
portable-pty = "0.8"
# setsid/killpg: a timed-out run must take its grandchildren with it.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
