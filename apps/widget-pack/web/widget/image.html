<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ảnh</title>
<style>
  :root { color-scheme: light dark; --fg: #1f2430; --muted: #7a8194; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8eaf0; --muted: #8a90a3; } }
  html, body { margin: 0; height: 100%; background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
  .wrap { height: 100%; display: flex; flex-direction: column; padding: 8px; box-sizing: border-box; gap: 6px; }
  a.img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; cursor: zoom-in; }
  .cap { font-size: 11px; color: var(--muted); text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg { color: var(--muted); font-size: 12px; padding: 12px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <a class="img" id="link" target="_blank" rel="noopener noreferrer">
    <img id="img" alt="">
  </a>
  <div class="cap" id="cap" hidden></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const url = (q.get('url') || '').trim();
  const caption = q.get('caption') || '';
  if (!/^https?:\/\//i.test(url) && !url.startsWith('data:image/')) {
    document.getElementById('wrap').innerHTML =
      '<div class="msg">Thiếu hoặc sai tham số `url` (cần http(s) hoặc data:image/…).</div>';
  } else {
    const img = document.getElementById('img');
    img.src = url;
    img.alt = q.get('alt') || caption || '';
    img.onerror = () => {
      document.getElementById('wrap').innerHTML =
        '<div class="msg">Không tải được ảnh: ' + url.replace(/</g, '&lt;') + '</div>';
    };
    document.getElementById('link').href = url;
    if (caption) {
      const c = document.getElementById('cap');
      c.textContent = caption;
      c.hidden = false;
    }
  }
</script>
</body>
</html>
