<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đếm ngược</title>
<style>
  :root { color-scheme: light dark;
    --fg: #1f2430; --muted: #7a8194; --accent: #5b8ff9; --bg: transparent; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8eaf0; --muted: #8a90a3; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
  .wrap { height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; padding: 12px; box-sizing: border-box; }
  .label { font-size: 13px; color: var(--muted); font-weight: 600;
    text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .digits { display: flex; gap: 10px; }
  .cell { text-align: center; min-width: 52px; }
  .num { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--accent); line-height: 1.1; }
  .unit { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .msg { font-size: 14px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="label" id="label"></div>
  <div class="digits" id="digits" hidden>
    <div class="cell"><div class="num" id="d">0</div><div class="unit">ngày</div></div>
    <div class="cell"><div class="num" id="h">00</div><div class="unit">giờ</div></div>
    <div class="cell"><div class="num" id="m">00</div><div class="unit">phút</div></div>
    <div class="cell"><div class="num" id="s">00</div><div class="unit">giây</div></div>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const label = q.get('label') || '';
  const rawTo = (q.get('to') || '').trim();
  document.getElementById('label').textContent = label;

  // "YYYY-MM-DD" (hết ngày hiểu là 00:00 hôm đó) hoặc ISO datetime đầy đủ.
  const iso = /^\d{4}-\d{2}-\d{2}$/.test(rawTo) ? rawTo + 'T00:00:00' : rawTo;
  const target = new Date(iso);
  const digits = document.getElementById('digits');
  const msg = document.getElementById('msg');

  if (!rawTo || isNaN(target.getTime())) {
    msg.textContent = rawTo
      ? 'Thời điểm không hợp lệ: "' + rawTo + '"'
      : 'Thiếu tham số `to` (YYYY-MM-DD hoặc ISO datetime).';
  } else {
    digits.hidden = false;
    const pad = (n) => String(n).padStart(2, '0');
    const tick = () => {
      const left = target.getTime() - Date.now();
      if (left <= 0) {
        digits.hidden = true;
        msg.textContent = '🎉 Đã tới' + (label ? ': ' + label : '!');
        clearInterval(timer);
        return;
      }
      const sec = Math.floor(left / 1000);
      document.getElementById('d').textContent = Math.floor(sec / 86400);
      document.getElementById('h').textContent = pad(Math.floor(sec / 3600) % 24);
      document.getElementById('m').textContent = pad(Math.floor(sec / 60) % 60);
      document.getElementById('s').textContent = pad(sec % 60);
    };
    tick();
    const timer = setInterval(tick, 1000);
  }
</script>
</body>
</html>
