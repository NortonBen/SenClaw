<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiến độ</title>
<style>
  :root { color-scheme: light dark;
    --fg: #1f2430; --muted: #7a8194; --accent: #5b8ff9; --track: rgba(127,127,127,.18); }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8eaf0; --muted: #8a90a3; } }
  html, body { margin: 0; height: 100%; background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
  .wrap { height: 100%; display: flex; flex-direction: column; justify-content: center;
    gap: 10px; padding: 16px 20px; box-sizing: border-box; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .label { font-size: 13px; font-weight: 600; color: var(--fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pct { font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .track { height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: var(--accent);
    transition: width .6s ease; width: 0; }
  .sub { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="label" id="label"></div>
    <div class="pct" id="pct"></div>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="sub" id="sub"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const num = (v, d) => { const n = Number(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : d; };
  const value = num(q.get('value'), 0);
  const max = Math.max(num(q.get('max'), 100), 0.000001);
  const label = q.get('label') || 'Tiến độ';
  const pct = Math.max(0, Math.min(100, (value / max) * 100));

  document.getElementById('label').textContent = label;
  document.getElementById('pct').textContent = Math.round(pct) + '%';
  document.getElementById('sub').textContent = value + ' / ' + max;
  // Đặt width sau một frame để có transition.
  requestAnimationFrame(() =>
    requestAnimationFrame(() => {
      document.getElementById('fill').style.width = pct + '%';
    }));
</script>
</body>
</html>
