<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<style>
  :root { color-scheme: light dark; --fg: #1f2430; --muted: #7a8194; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8eaf0; --muted: #8a90a3; } }
  html, body { margin: 0; height: 100%; background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
  .wrap { height: 100%; display: flex; flex-direction: column; padding: 8px; box-sizing: border-box; gap: 6px; }
  video { flex: 1; min-height: 0; width: 100%; border-radius: 10px; background: #000; }
  .cap { font-size: 11px; color: var(--muted); text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg { color: var(--muted); font-size: 12px; padding: 12px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <video id="video" controls playsinline preload="metadata"></video>
  <div class="cap" id="cap" hidden></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const url = (q.get('url') || '').trim();
  const caption = q.get('caption') || '';
  if (!/^https?:\/\//i.test(url)) {
    document.getElementById('wrap').innerHTML =
      '<div class="msg">Thiếu hoặc sai tham số `url` — cần một URL http(s) phát được (không dùng đường dẫn file).</div>';
  } else {
    const v = document.getElementById('video');
    v.src = url;
    if (q.get('poster')) v.poster = q.get('poster');
    if (q.get('autoplay') === 'true') { v.autoplay = true; v.muted = true; }
    v.onerror = () => {
      document.getElementById('wrap').innerHTML =
        '<div class="msg">Không phát được video: ' + url.replace(/</g, '&lt;') + '</div>';
    };
    if (caption) {
      const c = document.getElementById('cap');
      c.textContent = caption;
      c.hidden = false;
    }
  }
</script>
</body>
</html>
