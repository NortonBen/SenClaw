<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { width: 260px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; color: #18181b; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display: block; margin: 8px 0 3px; color: #555; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
      button { margin-top: 12px; width: 100%; padding: 8px; border: none; border-radius: 6px; background: #ff0033; color: #fff; font-weight: 600; cursor: pointer; }
      .status { margin-top: 10px; padding: 6px 8px; border-radius: 6px; background: #f2f2f2; font-size: 12px; }
      .ok { color: #16a34a; } .off { color: #999; }
    </style>
  </head>
  <body>
    <h1>▶️ YouTube — SenClaw</h1>
    <label>WS port (extension bridge)</label>
    <input id="wsPort" type="number" placeholder="9223" />
    <label>HTTP port (app)</label>
    <input id="httpPort" type="number" placeholder="4491" />
    <button id="save">Lưu &amp; kết nối lại</button>
    <div class="status" id="status">…</div>
    <script src="popup.js"></script>
  </body>
</html>
