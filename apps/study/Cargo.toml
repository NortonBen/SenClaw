[package]
name = "study"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "study"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs", "cors"] }
# 0.32 exactly — a version skew here is a link error, not a warning
# (bài học apps/hub).
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
# Document ingestion — same crates apps/search and apps/ontology use for the
# same job, so extraction behaviour matches across apps.
pdf-extract = "0.7"      # PDF text layer (a scan has none — reported, not swallowed)
quick-xml = "0.37"       # docx innards
zip = { version = "2", default-features = false, features = ["deflate"] } # docx container

[dev-dependencies]
tempfile = "3"
