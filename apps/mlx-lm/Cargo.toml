[package]
name = "mlx-lm"
version = "0.1.0"
edition = "2021"
description = "Local LLM inference on Apple Silicon via MLX, served to SenClaw as an LLM provider"

[[bin]]
name = "mlx-lm"
path = "src/main.rs"

[dependencies]
app-space-sdk = { path = "../../app-space-sdk" }
local-model-core = { path = "../local-model-core" }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
regex = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }

# The MLX stack, at the same revision the daemon pinned. `mlx-sys` is a direct
# read of the MLX allocator (`mlx_get_active_memory`), used by the idle-unload
# path to tell "freed" from "returned to the OS".
mlx-rs = { workspace = true }
mlx-sys = { workspace = true }
turboquant-rs = "0.4.1"

tokenizers = { workspace = true }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }
half = { workspace = true }
safetensors = { workspace = true }
bytemuck = "1"
# Gemma-4 vision input: decode → RGB → 224×224 bicubic → CHW f32.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }

[dev-dependencies]
tempfile = { workspace = true }
