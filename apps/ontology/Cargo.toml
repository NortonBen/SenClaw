[package]
name = "ontology"
version = "0.1.0"
edition = "2021"

[dependencies]
app-space-sdk = { path = "../../app-space-sdk" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["fs", "cors"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
# RDF triple store + SPARQL 1.1 (in-memory; no RocksDB C++ build)
oxigraph = { version = "0.4", default-features = false }
# Stable IRI minting for keyless entities
sha2 = "0.10"
hex = "0.4"
# CSV source parsing
csv = "1"
# Entity-resolution string similarity
strsim = "0.11"
# ---- universal ingest (many source formats -> one normalized table/text) ----
# "dates" is off by default; without it every date cell reads back as an Excel
# serial number and the profiler types the column as an integer.
calamine = { version = "0.26", features = ["dates"] }        # xlsx / xlsm / xls / ods
# calamine pulls chrono with no features, which leaves NaiveDateTime unable to
# format itself; naming it here turns on `std` for the whole graph.
chrono = { version = "0.4", default-features = false, features = ["std"] }
quick-xml = "0.37"                                           # XML sources + docx innards
serde_yaml = "0.9"                                           # YAML sources
zip = { version = "2", default-features = false, features = ["deflate"] } # docx container
base64 = "0.22"                                              # binary upload transport
pdf-extract = "0.7"                                          # PDF text layer
