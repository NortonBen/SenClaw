name: Desktop build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Branch pushes only rebuild when code that feeds this workflow changed
    # (docs-only commits skip). NOTE: tag pushes ignore `paths` — a release
    # tag always builds the full desktop bundle, which is intended.
    paths:
      - "src/**"
      - "desktop_app/**"
      - "apps/**"
      - "app-space-sdk/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "desktop_app/**"
      - "apps/**"
      - "app-space-sdk/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.6"
  # Skip debuginfo in CI dev/test builds — big compile + cache-size win,
  # backtraces in CI logs aren't worth the minutes.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # ── Quick CI check on branch pushes / PRs ────────────────────────────────────
  # Skipped on tag pushes: a release tag is cut from a main commit that this
  # job already validated, and re-running it would both duplicate the work and
  # serialize the (long) daemon+desktop matrix behind it.
  check:
    name: Cargo check + Flutter analyze
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # NOTE: no separate `cargo check` — `cargo test` compiles the whole
      # workspace anyway, so a prior check step just paid ~7 min twice.
      # Tests run with default parallelism; the serial `--test-threads=1`
      # requirement only applies to MLX tests, which need the (Apple-only)
      # `local-mlx` feature and are not compiled here.
      - name: Cargo test
        run: cargo test --all

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter analyze
        working-directory: desktop_app
        run: |
          flutter pub get
          flutter analyze

  # ── Full desktop bundle — only on tags or workflow_dispatch ─────────────────
  # Daemon (cargo, release) builds FIRST inside each matrix job, then the
  # Flutter app, then bundling. No `needs: check` — tags start building
  # immediately instead of waiting ~10 min behind a redundant re-check.
  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
          # x86_64-apple-darwin (macos-13, Intel) temporarily disabled —
          # re-enable when an Intel build is actually needed.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop deps (GTK + tray + gstreamer)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libnotify-dev
        # NOTE: libunwind-dev is named explicitly — the GitHub runner image
        # ships libunwind-14-dev, which apt refuses to auto-swap when it is
        # only a transitive dependency of libgstreamer1.0-dev.

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Build senclaw daemon binary
        run: cargo build --release --bin senclaw --target ${{ matrix.target }}

      - name: Build Flutter desktop app
        working-directory: desktop_app
        run: |
          flutter pub get
          flutter build ${{ matrix.platform }} --release

      - name: Bundle daemon + collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          BIN_DIR="target/${{ matrix.target }}/release"
          case "${{ matrix.platform }}" in
            macos)
              APP="desktop_app/build/macos/Build/Products/Release/SenClaw Desktop.app"
              cp "$BIN_DIR/senclaw" "$APP/Contents/Resources/senclaw"
              # zip the .app for upload
              ditto -c -k --keepParent "$APP" "dist-artifacts/SenClaw-${{ matrix.target }}.app.zip"
              cp "$BIN_DIR/senclaw" "dist-artifacts/senclaw-${{ matrix.target }}"
              ;;
            windows)
              REL="desktop_app/build/windows/x64/runner/Release"
              cp "$BIN_DIR/senclaw.exe" "$REL/senclaw.exe"
              powershell -Command "Compress-Archive -Path '$REL/*' -DestinationPath 'dist-artifacts/SenClaw-${{ matrix.target }}.zip'"
              cp "$BIN_DIR/senclaw.exe" "dist-artifacts/senclaw-${{ matrix.target }}.exe"
              ;;
            linux)
              REL="desktop_app/build/linux/x64/release/bundle"
              cp "$BIN_DIR/senclaw" "$REL/senclaw"
              tar -C "$REL" -czf "dist-artifacts/SenClaw-${{ matrix.target }}.tar.gz" .
              cp "$BIN_DIR/senclaw" "dist-artifacts/senclaw-${{ matrix.target }}"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: senclaw-${{ matrix.target }}
          if-no-files-found: ignore
          path: dist-artifacts/

  # ── Web UI dist bundle — downloaded on demand by `senclaw web` ──────────────
  web:
    name: Build web dist
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web UI
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Pack dist
        run: |
          mkdir -p dist-artifacts
          tar -C web/dist -czf dist-artifacts/senclaw-web-dist.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: senclaw-web-dist
          path: dist-artifacts/

  # ── Create GitHub Release and attach artifacts ───────────────────────────────
  release:
    name: Create release
    needs: [build, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SenClaw ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-artifacts/*
