name: Desktop build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Branch pushes only rebuild when code that feeds this workflow changed
    # (docs-only commits skip). NOTE: tag pushes ignore `paths` — a release
    # tag always builds the full desktop bundle, which is intended.
    paths:
      - "src/**"
      - "desktop_app/**"
      - "apps/**"
      - "app-space-sdk/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "desktop_app/**"
      - "apps/**"
      - "app-space-sdk/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.6"
  # Skip debuginfo in CI dev/test builds — big compile + cache-size win,
  # backtraces in CI logs aren't worth the minutes.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # ── Quick CI check on branch pushes / PRs ────────────────────────────────────
  # Skipped on tag pushes: a release tag is cut from a main commit that this
  # job already validated, and re-running it would both duplicate the work and
  # serialize the (long) daemon+desktop matrix behind it.
  check:
    name: Cargo test + Flutter analyze/test
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # The full-workspace dev build needs ~17 GB of target dir; the stock
      # ubuntu runner has ~14 GB free. Purging the preinstalled toolchains we
      # never use (.NET, Android, GHC, CodeQL) reclaims ~25-30 GB — without
      # this the job dies mid-build on a full disk with no readable error.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # NOTE: no separate `cargo check` — `cargo test` compiles the whole
      # workspace anyway, so a prior check step just paid ~7 min twice.
      # Tests run with default parallelism; the serial `--test-threads=1`
      # requirement only applies to MLX tests, which need the (Apple-only)
      # `local-mlx` feature and are not compiled here.
      #
      # Debuginfo off: tests don't need it, and it halves the target size —
      # the other half of the disk-exhaustion fix above.
      #
      # On failure the LOG TAIL becomes ::error:: check-run annotations —
      # readable through the public API without auth, unlike the raw step log.
      # The tail is pattern-independent, so it also surfaces non-test deaths
      # (linker OOM, "No space left on device") that a FAILED-line grep misses.
      # This job had been silently red for weeks because the failure was
      # invisible outside the web UI.
      - name: Cargo test
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          # No ANSI in the log: the ::error:: extraction below matches on line
          # prefixes, and color escapes silently break those anchors (that is
          # how one iteration of this hunt reported nothing at all).
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          if ! cargo test --all --no-fail-fast 2>&1 | tee /tmp/cargo-test.log; then
            # 10-annotation cap per step — panic blocks carry both the failing
            # test's name (header line) and its actual assertion message.
            { grep -aA2 "^---- .* stdout ----$" /tmp/cargo-test.log | grep -av "^--$" | head -8
              grep -aE "^error" /tmp/cargo-test.log | sort -u | head -1
              df -h / | tail -1
            } | while IFS= read -r line; do echo "::error title=cargo test::${line}"; done
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # Same public-annotation contract as Cargo test above: on failure the
      # log tail is readable without auth.
      - name: Flutter analyze + test
        working-directory: desktop_app
        shell: bash
        run: |
          set -o pipefail
          if ! { flutter pub get && flutter analyze && flutter test; } 2>&1 | tee /tmp/flutter.log; then
            tail -n 9 /tmp/flutter.log \
              | while IFS= read -r line; do echo "::error title=flutter::${line}"; done
            exit 1
          fi

  # ── Full desktop bundle — only on tags or workflow_dispatch ─────────────────
  # Daemon (cargo, release) builds FIRST inside each matrix job, then the
  # Flutter app, then bundling. No `needs: check` — tags start building
  # immediately instead of waiting ~10 min behind a redundant re-check.
  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            # Full Apple-Silicon daemon feature set — keep in sync with the
            # Makefile's DAEMON_FEATURES. Without local-mlx-tts /
            # local-mlx-whisper the released daemon silently falls back to the
            # macOS voice for TTS and has no local STT at all.
            daemon_features: "local-mlx,local-embed-metal,local-embed,local-mlx-whisper,local-mlx-tts,ocr-paddle-metal,tts-vieneu"
          # x86_64-apple-darwin (macos-13, Intel) temporarily disabled —
          # re-enable when an Intel build is actually needed.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            daemon_features: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            daemon_features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop deps (GTK + tray + gstreamer)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libnotify-dev \
            libkeybinder-3.0-dev
        # NOTE: libunwind-dev is named explicitly — the GitHub runner image
        # ships libunwind-14-dev, which apt refuses to auto-swap when it is
        # only a transitive dependency of libgstreamer1.0-dev.

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Restore ONLY (plain actions/cache, not Swatinem/rust-cache): the seed
      # is written on main by warm-cache.yml, and the version-bump commit that
      # precedes every tag changes Cargo.lock — rust-cache matches keys
      # EXACTLY (no restore-keys by design), so a tag build would miss the
      # seed every single time. The prefix fallback below restores the newest
      # main seed instead; cargo then rebuilds only what actually changed.
      # No save step: a cache saved on a tag ref is unreadable by every other
      # ref — pure quota waste that evicts the useful main caches.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: relcache-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: relcache-v1-${{ matrix.target }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # Standalone crate (own lockfile, own target dir) so it builds in
      # seconds and never inherits the daemon's dependency tree. On Windows it
      # is a windowed no-console binary with a small progress window — the
      # thing the desktop app hands the bundle swap to.
      - name: Build update_desktop helper
        shell: bash
        run: cargo build --release --manifest-path update_desktop/Cargo.toml --target ${{ matrix.target }}

      - name: Build senclaw daemon binary
        shell: bash
        run: |
          if [ -n "${{ matrix.daemon_features }}" ]; then
            cargo build --release --bin senclaw --target ${{ matrix.target }} \
              --features "${{ matrix.daemon_features }}"
          else
            cargo build --release --bin senclaw --target ${{ matrix.target }}
          fi

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          # The git tag is the single source of version identity:
          #   tag v0.3.0 → Cargo version 0.3.0 → SENCLAW_VERSION 0.3.0
          # A workflow_dispatch build has no tag, so it stays 'dev', which
          # disables the in-app updater (app_config.dart::kIsDevBuild) — a
          # non-release build must never offer to overwrite itself.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="dev"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # --build-name feeds CFBundleShortVersionString / the Windows file
          # version and must be a bare x.y.z: 'dev' is rejected, and so is a
          # prerelease suffix (0.3.0-beta.1 → 0.3.0). SENCLAW_VERSION above
          # keeps the full string — that is what the updater compares.
          case "$VER" in
            dev) echo "build_name=0.0.0" >> "$GITHUB_OUTPUT" ;;
            *)   echo "build_name=${VER%%-*}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build Flutter desktop app
        working-directory: desktop_app
        run: |
          flutter pub get
          # Single line on purpose: this step has no `shell:`, so Windows runs
          # it under pwsh, where a trailing `\` is not a line continuation.
          flutter build ${{ matrix.platform }} --release --build-name="${{ steps.ver.outputs.build_name }}" --dart-define=SENCLAW_VERSION="${{ steps.ver.outputs.version }}" --dart-define=SENCLAW_TARGET="${{ matrix.target }}"

      - name: Bundle daemon + collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          BIN_DIR="target/${{ matrix.target }}/release"
          UPD_DIR="update_desktop/target/${{ matrix.target }}/release"
          case "${{ matrix.platform }}" in
            macos)
              APP="desktop_app/build/macos/Build/Products/Release/SenClaw Desktop.app"
              cp "$BIN_DIR/senclaw" "$APP/Contents/Resources/senclaw"
              cp "$UPD_DIR/update_desktop" "$APP/Contents/Resources/update_desktop"
              # MLX resolves mlx.metallib next to the executable; the compiled-in
              # METAL_PATH fallback points into the CI runner's target dir and
              # does not exist on user machines — without this copy every MLX
              # call (TTS/STT/local LLM) aborts with "Failed to load the
              # default metallib".
              METALLIB=$(find "target/${{ matrix.target }}/release/build" -name mlx.metallib | head -1)
              if [ -n "$METALLIB" ]; then
                cp "$METALLIB" "$APP/Contents/Resources/mlx.metallib"
                cp "$METALLIB" "dist-artifacts/mlx-${{ matrix.target }}.metallib"
              else
                echo "::warning::mlx.metallib not found — MLX features will not work in the packaged app"
              fi
              # zip the .app for upload
              ditto -c -k --keepParent "$APP" "dist-artifacts/SenClaw-${{ matrix.target }}.app.zip"
              cp "$BIN_DIR/senclaw" "dist-artifacts/senclaw-${{ matrix.target }}"
              ;;
            windows)
              REL="desktop_app/build/windows/x64/runner/Release"
              cp "$BIN_DIR/senclaw.exe" "$REL/senclaw.exe"
              cp "$UPD_DIR/update_desktop.exe" "$REL/update_desktop.exe"
              powershell -Command "Compress-Archive -Path '$REL/*' -DestinationPath 'dist-artifacts/SenClaw-${{ matrix.target }}.zip'"
              cp "$BIN_DIR/senclaw.exe" "dist-artifacts/senclaw-${{ matrix.target }}.exe"
              ;;
            linux)
              REL="desktop_app/build/linux/x64/release/bundle"
              cp "$BIN_DIR/senclaw" "$REL/senclaw"
              cp "$UPD_DIR/update_desktop" "$REL/update_desktop"
              tar -C "$REL" -czf "dist-artifacts/SenClaw-${{ matrix.target }}.tar.gz" .
              cp "$BIN_DIR/senclaw" "dist-artifacts/senclaw-${{ matrix.target }}"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: senclaw-${{ matrix.target }}
          if-no-files-found: ignore
          path: dist-artifacts/

  # ── Web UI dist bundle — downloaded on demand by `senclaw web` ──────────────
  web:
    name: Build web dist
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web UI
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Pack dist
        run: |
          mkdir -p dist-artifacts
          tar -C web/dist -czf dist-artifacts/senclaw-web-dist.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: senclaw-web-dist
          path: dist-artifacts/

  # ── Create GitHub Release and attach artifacts ───────────────────────────────
  release:
    name: Create release
    needs: [build, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the manifest step derives its changelog from
          # `git log <prev-tag>..<tag>`, which needs more than a shallow clone.
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh release-artifacts/

      # Update manifest consumed by the desktop app's updater. It is fetched as
      # a release ASSET (releases/latest/download/latest.json) rather than via
      # the GitHub API, which rate-limits at 60 req/h per IP — every machine
      # behind one office NAT shares that budget. `latest/download/` redirects
      # to the newest NON-prerelease, so the stable channel falls out for free
      # and `v*-beta.*` manifests are simply never resolved.
      - name: Generate update manifest
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          # In-app changelog. `generate_release_notes` below fills the web page;
          # this feeds the app's Updates panel, which cannot call the API.
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            NOTES=$(git log --pretty=format:'- %s' "${PREV}..${TAG}")
          else
            NOTES="- Initial release"
          fi

          # Derive the asset map from what actually built — never hard-code the
          # target list, or re-enabling a matrix entry (e.g. Intel macOS) would
          # strand those users on an old version with no update ever offered.
          # Suffix strip order matters: .app.zip before .zip.
          ASSETS='{}'
          for f in release-artifacts/SenClaw-*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            triple="${base#SenClaw-}"
            triple="${triple%.app.zip}"
            triple="${triple%.tar.gz}"
            triple="${triple%.zip}"
            ASSETS=$(jq --arg t "$triple" --arg n "$base" \
                        --argjson s "$(stat -c%s "$f")" \
                        --arg h "$(sha256sum "$f" | cut -d' ' -f1)" \
                        '.[$t] = {name: $n, size: $s, sha256: $h}' <<<"$ASSETS")
          done

          if [ "$(jq 'length' <<<"$ASSETS")" -eq 0 ]; then
            echo "::error::no SenClaw-* bundles in release-artifacts/ — refusing to publish an empty manifest"
            exit 1
          fi

          # jq builds the JSON so arbitrary commit subjects in $NOTES cannot
          # break escaping.
          jq -n --arg v "$VER" \
                --arg p "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg n "$NOTES" \
                --arg m "0.0.0" \
                --argjson a "$ASSETS" \
                '{version: $v, publishedAt: $p, notes: $n, minVersion: $m, assets: $a}' \
                > release-artifacts/latest.json
          cat release-artifacts/latest.json

          # Release-page body. `generate_release_notes` only fills a release
          # softprops CREATES — when a sibling workflow (hub/extension/apps)
          # uploads its asset first, the release already exists with an empty
          # body and would stay empty (v0.3.0 and the first v0.4.0 did). An
          # explicit body_path is applied on update as well, so the changelog
          # survives whichever workflow wins the race.
          # NOT under release-artifacts/: everything there is uploaded as an
          # asset.
          {
            echo "$NOTES"
            if [ -n "$PREV" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SenClaw ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # On create, GitHub appends the auto-generated section after the
          # body; on update only body_path applies (see RELEASE_NOTES.md note).
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*
