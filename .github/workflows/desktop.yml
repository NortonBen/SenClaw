name: Desktop build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  # ── Quick CI check on every push/PR ─────────────────────────────────────────
  check:
    name: Cargo check + Flutter analyze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Cargo check
        run: cargo check --all

      - name: Cargo test
        run: cargo test --all -- --test-threads=1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter analyze
        working-directory: desktop_app
        run: |
          flutter pub get
          flutter analyze

  # ── Full desktop bundle — only on tags or workflow_dispatch ─────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
          - os: macos-13
            target: x86_64-apple-darwin
            platform: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop deps (GTK + tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Build senclaw daemon binary
        run: cargo build --release --bin senclaw --target ${{ matrix.target }}

      - name: Build Flutter desktop app
        working-directory: desktop_app
        run: |
          flutter pub get
          flutter build ${{ matrix.platform }} --release

      - name: Bundle daemon + collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          BIN_DIR="target/${{ matrix.target }}/release"
          case "${{ matrix.platform }}" in
            macos)
              APP="desktop_app/build/macos/Build/Products/Release/SenClaw Desktop.app"
              cp "$BIN_DIR/senclaw" "$APP/Contents/Resources/senclaw"
              # zip the .app for upload
              ditto -c -k --keepParent "$APP" "dist-artifacts/SenClaw-${{ matrix.target }}.app.zip"
              cp "$BIN_DIR/senclaw" "dist-artifacts/senclaw-${{ matrix.target }}"
              ;;
            windows)
              REL="desktop_app/build/windows/x64/runner/Release"
              cp "$BIN_DIR/senclaw.exe" "$REL/senclaw.exe"
              powershell -Command "Compress-Archive -Path '$REL/*' -DestinationPath 'dist-artifacts/SenClaw-${{ matrix.target }}.zip'"
              cp "$BIN_DIR/senclaw.exe" "dist-artifacts/senclaw-${{ matrix.target }}.exe"
              ;;
            linux)
              REL="desktop_app/build/linux/x64/release/bundle"
              cp "$BIN_DIR/senclaw" "$REL/senclaw"
              tar -C "$REL" -czf "dist-artifacts/SenClaw-${{ matrix.target }}.tar.gz" .
              cp "$BIN_DIR/senclaw" "dist-artifacts/senclaw-${{ matrix.target }}"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: senclaw-${{ matrix.target }}
          if-no-files-found: ignore
          path: dist-artifacts/

  # ── Web UI dist bundle — downloaded on demand by `senclaw web` ──────────────
  web:
    name: Build web dist
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web UI
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Pack dist
        run: |
          mkdir -p dist-artifacts
          tar -C web/dist -czf dist-artifacts/senclaw-web-dist.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: senclaw-web-dist
          path: dist-artifacts/

  # ── Create GitHub Release and attach artifacts ───────────────────────────────
  release:
    name: Create release
    needs: [build, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SenClaw ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-artifacts/*
