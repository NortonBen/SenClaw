name: Chrome extension build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "senclaw-extension-chrome/**"
      - ".github/workflows/extension.yml"
  pull_request:
    branches: [main]
    paths:
      - "senclaw-extension-chrome/**"
  workflow_dispatch:

# The release step creates/updates a GitHub Release — needs write on contents
# (the default GITHUB_TOKEN is read-only, which 403s action-gh-release).
permissions:
  contents: write

jobs:
  # `paths:` filters don't apply to tag pushes — every tag would rebuild the
  # extension even when nothing under senclaw-extension-chrome/ changed.
  # Compare against the previous tag and let downstream jobs skip.
  changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [[ -z "$prev" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git diff --quiet "$prev" "$GITHUB_SHA" -- senclaw-extension-chrome/ .github/workflows/extension.yml; then
              echo "No extension changes since $prev — skipping build."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build extension
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: senclaw-extension-chrome

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: senclaw-extension-chrome/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension
        run: npm run build

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Package (zip) — Chrome
        run: npm run zip

      - name: Package (zip) — Firefox
        run: npm run zip:firefox

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: senclaw-extension-chrome
          path: senclaw-extension-chrome/.output/
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: senclaw-extension-chrome/.output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
