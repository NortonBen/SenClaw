name: Hub backend build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "hub-backend/**"
      - ".github/workflows/hub-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "hub-backend/**"
  workflow_dispatch:

jobs:
  # `paths:` filters don't apply to tag pushes — every tag would rebuild the
  # hub even when nothing under hub-backend/ changed. Compare against the
  # previous tag and let downstream jobs skip.
  changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [[ -z "$prev" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git diff --quiet "$prev" "$GITHUB_SHA" -- hub-backend/ .github/workflows/hub-backend.yml; then
              echo "No hub-backend changes since $prev — skipping build."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & test
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: hub-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: hub-backend/go.mod
          cache-dependency-path: hub-backend/go.sum

      - name: Install system deps (CGO + SQLite)
        run: sudo apt-get install -y --no-install-recommends gcc libc6-dev libsqlite3-dev

      - name: Download modules
        run: go mod download

      - name: Build
        run: CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o /tmp/hub-server ./cmd/server

      - name: Test
        run: CGO_ENABLED=1 go test ./...

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-backend-linux-amd64
          path: /tmp/hub-server
          if-no-files-found: warn

  docker:
    name: Docker image
    needs: [changes, build]
    runs-on: ubuntu-22.04
    if: |
      needs.changes.outputs.changed == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/senclaw-hub-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: hub-backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
