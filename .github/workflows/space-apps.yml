name: Space Apps build

# Builds every Space App into its installable zip (the artifact you upload in
# SenClaw → Apps → Install). Zips are published as workflow artifacts on every
# run and attached to the GitHub Release when a v* tag is pushed.
#
# Rust apps (ssh-manager, email, deepwiki, code-ide, luna-calendar, mindmap,
# mini-browser, skill-builder, crm) are built on macOS arm64 — the binary inside the
# zip must match the machine SenClaw runs on. Node apps (test-manager) are
# platform-independent. google-workspace-space-app is intentionally NOT built
# here.
#
# Only apps whose directory actually changed are built: `paths:` gates branch
# pushes for the workflow as a whole (and never applies to tag pushes), so the
# `changes` job diffs each app against the previous tag / pushed range and
# emits a dynamic matrix.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/**"
      # `@senclaw/space-sdk` is a file: dependency of several apps and its
      # dist/ is built in CI — SDK changes must rebuild the dependents.
      - "senclaw-sdk/senclaw-app-sdk/**"
      - ".github/workflows/space-apps.yml"
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-22.04
    outputs:
      rust_matrix: ${{ steps.check.outputs.rust_matrix }}
      node_matrix: ${{ steps.check.outputs.node_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          set -e
          RUST_APPS='[{"id":"ssh-manager","zip":"ssh-manager.zip"},{"id":"email","zip":"email-app.zip"},{"id":"deepwiki","zip":"deepwiki-app.zip"},{"id":"code-ide","zip":"code-ide-app.zip"},{"id":"luna-calendar","zip":"luna-calendar-app.zip"},{"id":"mindmap","zip":"mindmap-app.zip"},{"id":"mini-browser","zip":"mini-browser-app.zip"},{"id":"skill-builder","zip":"skill-builder-app.zip"},{"id":"crm","zip":"crm-app.zip"}]'
          NODE_APPS='[{"dir":"test-manager","zip":"test-manager.zip"}]'

          # A release tag must be self-contained: build EVERY app so all
          # installers attach to the release, regardless of what changed.
          # (Per-app change detection is only a dev-efficiency win on branches.)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "rust_matrix=$RUST_APPS" >> "$GITHUB_OUTPUT"
            echo "node_matrix=$NODE_APPS" >> "$GITHUB_OUTPUT"
            echo "Tag push — building ALL apps for the release."
            exit 0
          fi

          base="${{ github.event.before }}"

          # No usable base (first tag / force push / manual dispatch), or the
          # workflow file / shared space-sdk changed → build everything.
          if [[ -z "$base" ]] \
             || ! git rev-parse -q --verify "$base^{commit}" >/dev/null \
             || ! git diff --quiet "$base" "$GITHUB_SHA" -- .github/workflows/space-apps.yml senclaw-sdk/senclaw-app-sdk/; then
            echo "rust_matrix=$RUST_APPS" >> "$GITHUB_OUTPUT"
            echo "node_matrix=$NODE_APPS" >> "$GITHUB_OUTPUT"
            echo "Building ALL apps (no diff base, or workflow/space-sdk changed)."
            exit 0
          fi

          changed_dir() { ! git diff --quiet "$base" "$GITHUB_SHA" -- "apps/$1/"; }

          rust="[]"; node="[]"
          for row in $(echo "$RUST_APPS" | jq -c '.[]'); do
            id=$(echo "$row" | jq -r '.id')
            if changed_dir "$id"; then rust=$(echo "$rust" | jq -c ". + [$row]"); fi
          done
          for row in $(echo "$NODE_APPS" | jq -c '.[]'); do
            dir=$(echo "$row" | jq -r '.dir')
            if changed_dir "$dir"; then node=$(echo "$node" | jq -c ". + [$row]"); fi
          done

          echo "Changed since $base → rust: $rust, node: $node"
          echo "rust_matrix=$rust" >> "$GITHUB_OUTPUT"
          echo "node_matrix=$node" >> "$GITHUB_OUTPUT"

  rust-apps:
    name: Rust apps (${{ matrix.app.id }}, macOS arm64)
    needs: changes
    if: needs.changes.outputs.rust_matrix != '[]'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.rust_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # save-if: caches saved on tag refs are unreadable by every other ref —
      # they only burn the 10GB quota and evict the main-branch caches that
      # tag builds actually restore from.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: space-apps
          save-if: ${{ github.ref_type != 'tag' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `@senclaw/space-sdk` is a file: dependency (ssh-manager's web UI);
      # its dist/ is gitignored, so build it before the app installs it.
      - name: Build @senclaw/space-sdk
        working-directory: senclaw-sdk/senclaw-app-sdk
        run: |
          npm install
          npm run build

      - name: Pack ${{ matrix.app.id }}
        run: bash apps/${{ matrix.app.id }}/scripts/pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.zip }}
          path: apps/${{ matrix.app.id }}/${{ matrix.app.zip }}
          if-no-files-found: error

  node-apps:
    name: Node apps (${{ matrix.app.dir }})
    needs: changes
    if: needs.changes.outputs.node_matrix != '[]'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.node_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `@senclaw/space-sdk` is a file: dependency with a gitignored dist/ —
      # build it first or `next build` fails with "Can't resolve
      # '@senclaw/space-sdk'".
      - name: Build @senclaw/space-sdk
        working-directory: senclaw-sdk/senclaw-app-sdk
        run: |
          npm install
          npm run build

      - name: Pack ${{ matrix.app.dir }}
        working-directory: apps/${{ matrix.app.dir }}
        run: |
          npm install
          npm run pack:zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.zip }}
          path: apps/${{ matrix.app.dir }}/${{ matrix.app.zip }}
          if-no-files-found: error

  # Attach every built zip to the GitHub Release on tag pushes. `always()`
  # because either family may have been legitimately skipped (unchanged).
  release:
    name: Attach zips to release
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [changes, rust-apps, node-apps]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check for artifacts
        id: have
        run: |
          if ls dist/*.zip >/dev/null 2>&1; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No app zips built for this tag (nothing changed)."
          fi

      - uses: softprops/action-gh-release@v2
        if: steps.have.outputs.any == 'true'
        with:
          files: dist/*.zip
          # desktop.yml owns the release body/notes — just append assets here
          # so we don't clobber its generated notes in a race.
          fail_on_unmatched_files: true
