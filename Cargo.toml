[workspace]
# The Space Apps moved to their own repository — with three exceptions that live
# here because they are not independent of it:
#
# - `app-space-sdk` is the Rust SDK those apps build against, published from
#   here.
# - `apps/mlx-lm` and `apps/candle` are the local-model engines, moved out of
#   the daemon. Their source *is* the daemon's old `src/local_model/`, and they
#   build against `app-space-sdk` by path. In the apps repo they needed a
#   `[patch]` pointing back at this checkout, which is a sign they belong here:
#   a change to the SDK's `llm` module or to a model architecture has to land
#   with them, not one release later.
# - `apps/local-model-core` is what those two share.
members = ["app-space-sdk", "apps/local-model-core", "apps/mlx-lm", "apps/candle", "crates/senclaw-media"]

# Bare `cargo build` / `cargo test` touch only the daemon.
#
# Without this, every `cargo test` in this repo would also compile mlx-rs and
# candle — minutes of unrelated native build on a run meant to check a daemon
# change, and the exact cost moving the engines out was supposed to remove.
# Build them explicitly: `cargo build -p mlx-lm`.
default-members = [".", "app-space-sdk"]
resolver = "2"

# ── Shared dependency versions ────────────────────────────────────────────────
# One place per version. The one that must never drift is mlx-rs/mlx-sys:
# `apps/mlx-lm` and `crates/senclaw-media` both build the MLX C++ runtime, and
# on the same revision they share every compiled artifact in target/ — on
# different revisions the workspace pays for two full MLX builds.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex = "1"
libc = "0.2"
dirs = "5"
tempfile = "3"
futures-util = "0.3"
tokio-util = "0.7"
async-stream = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# `fancy-regex`, not `onig`: oniguruma is a C library that fails to
# cross-compile and adds a native build step on every platform, while
# fancy-regex is the pure-Rust engine HF ships for wasm builds — equivalent
# behaviour, and what lets the media sidecar `cargo check` for Windows from
# anywhere.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
minijinja = { version = "2", features = ["serde"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
half = "2.4"
safetensors = "0.4"
mlx-rs = { git = "https://github.com/oxiglade/mlx-rs", tag = "v0.25.3", features = ["metal", "accelerate"] }
mlx-sys = { git = "https://github.com/oxiglade/mlx-rs", tag = "v0.25.3", package = "mlx-sys" }
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac", "flac", "wav", "ogg", "vorbis", "pcm", "adpcm"] }
rubato = "0.15"
realfft = "3.5"

[package]
name = "senclaw"
version = "0.8.0"
edition = "2021"
description = "SenClaw provides the runtime machinery around large language models: permissions, memory, scheduling, multi-agent orchestration, channel adapters, Space Apps, local model support, and a Web UI"
license = "MIT"
authors = ["Benji"]
repository = "https://github.com/NortonBen/SenClaw"
homepage = "https://senclaw.bacnd.com/"

[[bin]]
name = "senclaw"
path = "src/main.rs"

[lib]
name = "senclaw"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Config / env
dotenvy = "0.15"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML frontmatter parsing for SKILL.md (OpenClaw-compatible metadata).
serde_yaml = "0.9"

# Errors / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# HTTP client / server (gateway + UIServer + WebSocket)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart", "blocking"], default-features = false }
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# SQLite + vector + FTS
rusqlite = { version = "0.32", features = ["bundled"] }

# Cron
cron = "0.13"
chrono = { version = "0.4", features = ["serde"] }

# Compression (replaces fflate)
flate2 = "1"
zip = "2"

# QR code (terminal)
qrcode = "0.14"

# UUID / random
uuid = { version = "1", features = ["v4", "v5", "serde"] }
rand = "0.8"

tokio-stream = "0.1"
portable-pty = "0.8"

# Encryption / Encoding
aes-gcm = "0.10"
base64 = "0.22"
urlencoding = "2"

# Channel adapters (Telegram has a Rust SDK; others go via REST through reqwest)
teloxide = { version = "0.13", default-features = false, features = ["ctrlc_handler", "rustls"] }

# Chinese tokenization (replaces nodejieba)
jieba-rs = "0.7"

# Home dir resolution (replaces os.homedir)
dirs = "5"

# Hex / hashing helpers (for buildModelKey, content hashing)
sha2 = "0.10"
hex = "0.4"

# Unified diff generation
similar = "2"

# Regex (query rewrite, pattern matching)
regex = "1"
glob = "0.3"
libc = "0.2.186"

# Lazy static initialization
once_cell = "1"

# Git operations for marketplace
git2 = "0.19"

# Code Knowledge Graph — AST parsing via tree-sitter
tree-sitter          = "0.25"
tree-sitter-language = "0.1"
tree-sitter-rust     = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python   = "0.25"
tree-sitter-bash     = "0.25"
tree-sitter-c        = "0.24"
tree-sitter-cpp      = "0.23"
tree-sitter-c-sharp  = "0.23"
tree-sitter-go       = "0.25"
tree-sitter-haskell  = "0.23"
tree-sitter-java     = "0.23"
tree-sitter-ruby     = "0.23"
tree-sitter-scala    = "0.26"
tree-sitter-ocaml    = "0.24"
tree-sitter-php      = "0.24"
tree-sitter-julia    = "0.23"
tree-sitter-verilog  = "1.0"
tree-sitter-agda     = "1.3"
tree-sitter-html     = "0.23"
tree-sitter-css      = "0.25"
tree-sitter-json     = "0.24"

# MCP server SDK (self-spawning subprocess architecture)
rmcp = { version = "1", features = ["transport-io"] }
schemars = "1"

# Sandboxed JavaScript engine (QuickJS) for the js-executor MCP server.
# No host bindings are exposed → no filesystem/network/process access by
# default; memory + wall-clock limits are enforced per evaluation.
rquickjs = "0.12"

# TypeScript → JavaScript transpiler (pure Rust). Used to run TS snippets on
# the QuickJS sandbox: parse as TS, strip types, codegen JS. swc (not oxc) —
# oxc 0.137 needs unstable `if let` guards; swc builds on stable.
swc_core = { version = "71", features = [
    "common",
    "ecma_ast",
    "ecma_parser",
    "ecma_codegen",
    "ecma_visit",
    "ecma_transforms",
    "ecma_transforms_typescript",
] }

# Local embedding via pure-Rust candle (no C++ runtime needed)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["fancy-regex"] }

# Tokio utilities (CancellationToken for zen-core abort)
tokio-util = { version = "0.7", features = ["rt"] }

minijinja = { version = "2", optional = true, features = ["serde"] }
minijinja-contrib = { version = "2", optional = true, features = ["pycompat"] }

# App Space & SSH Dependencies
russh = "0.44.1"
russh-keys = "0.44.0"

# VieNeu-TTS v3 Turbo backend (ONNX Runtime sidecar, CPU — works beyond Apple
# Silicon). See src/tts/vieneu. `ort` downloads a prebuilt onnxruntime at build.
ort = { version = "2.0.0-rc.10", optional = true, features = ["download-binaries"] }
# Vendored sea-g2p core (src/tts/vieneu/sea_g2p) needs look-around regexes and
# mmaps its phoneme dictionary.
fancy-regex = { version = "0.18", optional = true }
memmap2 = { version = "0.9", optional = true }

# Native MLX inference on Apple Silicon (feature-gated; macOS-only build).
bytemuck = { version = "1", optional = true }

# Enable via: cargo build --features local-mlx
# The MLX runtime, from [oxiglade/mlx-rs](https://github.com/oxiglade/mlx-rs)
# (upstream oxideai tag v0.25.3). The daemon needs it for Whisper ASR, both TTS
# backends and the cognitive embedder — the *language* models it used to run
# live in `apps/mlx-lm` now, with their own copy of this dependency.
# Same revision as mlx-rs — direct read of MLX allocator (`mlx_get_active_memory`, etc.).

# Whisper-family ASR audio front-end (pure-Rust, CPU). Decode any common
# container/codec → mono f32 → resample 16 kHz → log-mel spectrogram.
# Enable via the `whisper-audio` feature (no MLX/Metal required, fully testable).

# Image preprocessing for Gemma-4 vision input (decode → RGB → 224×224
# BICUBIC resize → rescale [0,1] → CHW float32). Pulled in by the
# `local-mlx` feature — there's no reason to load images in a build that
# can't run the Gemma-4 model that consumes them.
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }

# Pure-Rust OCR via PaddleOCR (PP-OCRv4/v5) on MNN inference backend.
# Enable via the `ocr-paddle` feature. macOS Metal/CoreML acceleration available
# via the additive `ocr-paddle-metal` feature. Off by default — pulls C++ MNN
# toolchain (cmake/clang) which we don't want in the default build.
ocr-rs = { git = "https://github.com/zibo-chen/rust-paddle-ocr.git", branch = "next", optional = true, default-features = false }
brush-core = "0.5"
brush-builtins = "0.2"
unicode-normalization = "0.1"

# Shared Space-App SDK — dispatch protocol types + stdio↔HTTP MCP bridge used by
# the MCPDispatcher engine (src/agent/mcp_dispatch).
app-space-sdk = { path = "app-space-sdk" }

# SSE streaming for the built-in Kanban MCP-over-HTTP endpoint (src/kanban/mcp.rs).
async-stream = "0.3"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4.5"
# Text rasterization for the OCR round-trip harness (examples/ocr_roundtrip.rs).
# Already in the dependency tree via `ocr-rs`, so this adds no new crates.
imageproc = "0.25"
ab_glyph = "0.2"

# OCR round-trip verification harness. Gated so plain `cargo build --examples`
# (without OCR support) doesn't try to compile against the MNN-backed engine.
[[example]]
name = "ocr_roundtrip"
required-features = ["ocr-paddle"]

[features]
# Pure-Rust local embeddings via candle (BERT/sentence-transformers, HuggingFace Hub).
# Build: cargo build --features local-embed
# Build with Apple Silicon Metal: cargo build --features local-embed-metal
local-embed = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
local-embed-metal = ["local-embed", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]


# NOTE — the `local-candle*` and LLM-side `local-mlx` model features are gone.
# Local LLM inference moved to `apps/mlx-lm` and `apps/candle`, which carry
# their own copies of candle / mlx-rs. `local-mlx` survives below because
# Whisper ASR, both TTS backends and the cognitive embedder still need the MLX
# runtime — it is no longer a *language model* feature.





# VieNeu-TTS v3 Turbo (48 kHz Vietnamese TTS) via ONNX Runtime — CPU, no MLX
# required, so this also works on Windows/Linux daemons.
# Build: cargo build --features tts-vieneu
tts-vieneu = ["dep:ort", "dep:fancy-regex", "dep:memmap2", "dep:tokenizers"]

# Pure-Rust OCR via PaddleOCR + MNN backend (cross-platform; CPU by default).
# Build: cargo build --features ocr-paddle
# The `image` crate is reused for decoding PNG/JPEG/WebP/BMP/GIF inputs.
ocr-paddle = ["dep:ocr-rs", "dep:image"]

# Additive: enable Metal + CoreML acceleration on macOS/iOS for OCR.
# Build (macOS): cargo build --features ocr-paddle-metal
ocr-paddle-metal = ["ocr-paddle", "ocr-rs/metal", "ocr-rs/coreml"]

# NOTE — Gemma-4 vision input does NOT have its own feature flag. Image
# decoding (the `image` crate) and the vision-side modules
# (`mlx_lm::models::gemma4_vision`) are bundled into `local-mlx` so a build
# that supports the Gemma-4 model also supports its image input. This keeps
# the feature surface to just {default, local-mlx} for the user.

[profile.release]
lto = "thin"
# 16 (the cargo default), NOT 1: the senclaw crate is enormous and cu=1 makes
# its codegen serial — measured ~37 min for the macOS release daemon in CI.
# Thin-LTO recovers most cross-unit optimisation, so the runtime cost is a few
# percent at worst; benchmark with `codegen-units = 1` restored if a hot MLX
# path ever needs squeezing.
codegen-units = 16
strip = true

# Optimize ALL dependencies even in the dev (debug) profile.
#
# The native MLX path (gated-delta sequential scan) is host-*dispatch*-bound:
# the bottleneck is constructing the MLX op graph that feeds the GPU, not the
# GPU kernels themselves. With unoptimized deps the mlx-rs / mlx-sys Rust glue
# can't dispatch fast enough and the GPU starves (high CPU%, low GPU%). A debug
# build was ~3.5–5× slower on Qwen3.5 prefill purely from this.
#
# Dependencies are compiled once and cached, so this does NOT slow iterative
# rebuilds of the `senclaw` crate. For the hot loop in our own crate
# (`src/local_model/mlx_lm/models/gated_delta.rs`) prefer `make run-release`;
# this override recovers most of the gap for everyday `make run`.
[profile.dev.package."*"]
opt-level = 3
# NOTE: optimizing the `senclaw` crate itself in dev (`[profile.dev.package.senclaw]
# opt-level = 2`) was measured to give only partial MLX gains (warm prefill ~121
# vs release's ~406 tok/s — release wins via the `lto=thin` + `codegen-units=1`
# cross-crate inlining of the tiny per-op calls) while making every `make run`
# rebuild ~2 min. Not worth it: use `make run-release` for native-MLX work.

# Windows direct sandbox (src/sandbox): AppContainer (isolation) + Job Object
# (limits). Target-gated so Unix builds are untouched. Mirrors apps/sandbox.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
]
